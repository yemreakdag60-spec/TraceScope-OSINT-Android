name: Build TraceScope OSINT Pro v1.3.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Test and Build TraceScope APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract TraceScope source
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'TraceScope-OSINT-Pro-v1.3.0-Source.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "TraceScope source ZIP not found."
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="extracted/TraceScope-OSINT-Pro-v1.3.0"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Android project not found."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Generate Gradle wrapper
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin
          chmod +x gradlew

      - name: Run unit tests
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Run Android Lint
        continue-on-error: true
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Build Debug APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TraceScope-OSINT-Pro-v1.3.0-APK
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
